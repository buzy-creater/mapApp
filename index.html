<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教育施設マップ</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f5f6f8;
    }

    header {
      padding: 16px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .description {
      margin: 0;
      font-size: 14px;
      color: #666;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 82px);
    }

    .sidebar {
      overflow-y: auto;
      padding: 16px;
      background: #ffffff;
      border-right: 1px solid #ddd;
    }

    .sidebar h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #f0f0f0;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
    }

    .count {
      color: #777;
      font-size: 12px;
      margin-left: auto;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-row {
      margin: 2px 0;
      font-size: 13px;
    }

    .marker-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 1px 6px rgba(0,0,0,.35);
    }

    @media (max-width: 768px) {
      header {
        padding: 12px;
      }

      h1 {
        font-size: 18px;
      }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: calc(100vh - 76px);
      }

      .sidebar {
        max-height: 220px;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>教育施設マップ</h1>
    <p class="description">GeoJSON内の施設を地図に表示します。種別ごとに色分け・表示切替できます。</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>表示する施設種別</h2>

      <div class="filter-actions">
        <button type="button" id="selectAll">すべて表示</button>
        <button type="button" id="clearAll">すべて非表示</button>
      </div>

      <div id="filters"></div>
    </aside>

    <main id="map"></main>
  </div>

  <script>
    const GEOJSON_FILE = "P29-23_13.geojson";

    const schoolTypes = {
      "16001": "小学校",
      "16002": "中学校",
      "16003": "中等教育学校",
      "16004": "高等学校",
      "16005": "高等専門学校",
      "16006": "短期大学",
      "16007": "大学",
      "16011": "幼稚園",
      "16012": "特別支援学校",
      "16013": "幼保連携型認定こども園",
      "16014": "義務教育学校",
      "16015": "各種学校",
      "16016": "専修学校"
    };

    const typeColors = {
      "16001": "#2E86DE",
      "16002": "#10AC84",
      "16003": "#5F27CD",
      "16004": "#EE5253",
      "16005": "#FF9F43",
      "16006": "#00D2D3",
      "16007": "#341F97",
      "16011": "#FF6B9A",
      "16012": "#576574",
      "16013": "#54A0FF",
      "16014": "#1DD1A1",
      "16015": "#C8D6E5",
      "16016": "#F368E0",
      "unknown": "#222222"
    };

    const map = L.map("map").setView([35.68, 139.76], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markersByType = {};
    const selectedTypes = new Set(Object.keys(schoolTypes));

    function getTypeCode(feature) {
      return feature?.properties?.P29_003 || "unknown";
    }

    function getTypeName(typeCode) {
      return schoolTypes[typeCode] || `不明な種別（${typeCode}）`;
    }

    function getColor(typeCode) {
      return typeColors[typeCode] || typeColors.unknown;
    }

    function createMarkerIcon(typeCode) {
      return L.divIcon({
        className: "",
        html: `<div class="marker-icon" style="background:${getColor(typeCode)}"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9],
        popupAnchor: [0, -8]
      });
    }

    function createPopupContent(feature) {
      const props = feature.properties;
      const typeCode = props.P29_003;
      const typeName = getTypeName(typeCode);
      const facilityName = props.P29_004 || "施設名不明";
      const address = props.P29_005 || "住所不明";

      return `
        <div class="popup-title">${facilityName}</div>
        <div class="popup-row"><strong>種別：</strong>${typeName}</div>
        <div class="popup-row"><strong>種別コード：</strong>${typeCode}</div>
        <div class="popup-row"><strong>住所：</strong>${address}</div>
        <div class="popup-row"><strong>施設ID：</strong>${props.P29_002 || "-"}</div>
      `;
    }

    function addMarker(feature) {
      const typeCode = getTypeCode(feature);

      if (!markersByType[typeCode]) {
        markersByType[typeCode] = [];
      }

      const coords = feature.geometry?.coordinates;
      if (!coords || coords.length < 2) return;

      const lng = coords[0];
      const lat = coords[1];

      const marker = L.marker([lat, lng], {
        icon: createMarkerIcon(typeCode)
      }).bindPopup(createPopupContent(feature));

      markersByType[typeCode].push(marker);

      if (selectedTypes.has(typeCode)) {
        marker.addTo(map);
      }
    }

    function updateMarkers() {
      Object.entries(markersByType).forEach(([typeCode, markers]) => {
        markers.forEach(marker => {
          if (selectedTypes.has(typeCode)) {
            if (!map.hasLayer(marker)) marker.addTo(map);
          } else {
            if (map.hasLayer(marker)) map.removeLayer(marker);
          }
        });
      });
    }

    function createFilters() {
      const filters = document.getElementById("filters");
      filters.innerHTML = "";

      const sortedTypeCodes = Object.keys(markersByType).sort();

      sortedTypeCodes.forEach(typeCode => {
        const label = document.createElement("label");
        label.className = "filter-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = selectedTypes.has(typeCode);
        checkbox.value = typeCode;

        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            selectedTypes.add(typeCode);
          } else {
            selectedTypes.delete(typeCode);
          }

          updateMarkers();
        });

        const dot = document.createElement("span");
        dot.className = "color-dot";
        dot.style.background = getColor(typeCode);

        const name = document.createElement("span");
        name.textContent = getTypeName(typeCode);

        const count = document.createElement("span");
        count.className = "count";
        count.textContent = markersByType[typeCode].length;

        label.appendChild(checkbox);
        label.appendChild(dot);
        label.appendChild(name);
        label.appendChild(count);

        filters.appendChild(label);
      });
    }

    document.getElementById("selectAll").addEventListener("click", () => {
      Object.keys(markersByType).forEach(typeCode => selectedTypes.add(typeCode));

      document.querySelectorAll('#filters input[type="checkbox"]').forEach(checkbox => {
        checkbox.checked = true;
      });

      updateMarkers();
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      selectedTypes.clear();

      document.querySelectorAll('#filters input[type="checkbox"]').forEach(checkbox => {
        checkbox.checked = false;
      });

      updateMarkers();
    });

    fetch(GEOJSON_FILE)
      .then(response => {
        if (!response.ok) {
          throw new Error(`GeoJSONを読み込めませんでした: ${response.status}`);
        }
        return response.json();
      })
      .then(geojson => {
        if (!geojson.features || !Array.isArray(geojson.features)) {
          throw new Error("GeoJSONのfeaturesが見つかりません。");
        }

        geojson.features.forEach(addMarker);
        createFilters();
        updateMarkers();

        const allMarkers = Object.values(markersByType).flat();

        if (allMarkers.length > 0) {
          const group = L.featureGroup(allMarkers);
          map.fitBounds(group.getBounds(), { padding: [24, 24] });
        }
      })
      .catch(error => {
        console.error(error);
        alert(
          "GeoJSONの読み込みに失敗しました。\n\n" +
          "確認してください：\n" +
          "・HTMLとP29-23_13.geojsonが同じフォルダにあるか\n" +
          "・GitHub PagesまたはLive Server経由で開いているか\n" +
          "・ファイル名が P29-23_13.geojson と一致しているか"
        );
      });
  </script>
</body>
</html>
